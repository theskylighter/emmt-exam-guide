<line x1="470" y1="40" x2="370" y2="40" stroke="#222" stroke-width="2.4" marker-end="url(#ar_pn_junction_depletion)"/><text x="420" y="36" font-size="12" text-anchor="middle" fill="#222" font-family="Georgia, serif" ></text>
<text x="500" y="44" font-size="13" text-anchor="start" fill="#222" font-family="Georgia, serif" font-weight="bold">Built-in field E (n → p)</text>
<text x="375" y="285" font-size="12" text-anchor="end" fill="#c0392b" font-family="Georgia, serif" >acceptor ions (A⁻) left behind</text>
<text x="465" y="285" font-size="12" text-anchor="start" fill="#2c6fbb" font-family="Georgia, serif" >donor ions (D⁺) left behind</text>
<line x1="380" y1="275" x2="385" y2="212" stroke="#c0392b"/><line x1="460" y1="275" x2="455" y2="212" stroke="#2c6fbb"/><text x="420" y="315" font-size="12.5" text-anchor="middle" fill="#333" font-family="Georgia, serif" >Diffusion pushes carriers across → they recombine → fixed ions remain → field E builds up → stops further diffusion.</text>
<text x="420" y="333" font-size="12.5" text-anchor="middle" fill="#333" font-family="Georgia, serif" >Result: a potential barrier V₀ (~0.7 V for Si). Forward bias lowers it, reverse bias raises it.</text>

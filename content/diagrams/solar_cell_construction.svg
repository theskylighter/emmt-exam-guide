<text x="450" y="445" font-size="12.5" text-anchor="middle" fill="#333" font-family="Georgia, serif" >Light → e⁻–h⁺ pairs → the junction field separates them → n side becomes (−), p side (+) → photovoltage; current flows through the load.</text>
